<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4fbff">
  <meta name="description" content="Happy Kids 歡樂遊戲島，陪孩子用圖片、聲音和遊戲探索世界。">
  <title>Happy Kids｜歡樂遊戲島</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Happy Kids 首頁">
        <span class="brand-mark" aria-hidden="true">☀</span>
        <span><strong>Happy Kids</strong><small>歡樂遊戲島</small></span>
      </a>
      <div class="top-actions">
        <div class="star-counter" aria-label="目前累積星星">
          <span aria-hidden="true">⭐</span><strong id="star-count">0</strong>
        </div>
        <button class="parent-button" id="parent-button" type="button" aria-expanded="false">
          <span aria-hidden="true">⚙</span><span class="parent-label">家長區</span>
        </button>
      </div>
    </header>

    <main>
      <section class="welcome">
        <div>
          <p class="eyebrow">HELLO, LITTLE EXPLORER!</p>
          <h1>今天想去哪裡玩？</h1>
          <p class="welcome-copy">點一點圖片，開始今天的小小冒險吧！</p>
        </div>
        <div class="welcome-cloud" aria-hidden="true"><span>☁</span><span>☁</span></div>
      </section>

      <section class="worlds" aria-label="遊戲世界">
        <button class="world-card vehicle-card" data-world="vehicles" type="button">
          <span class="card-art art-vehicles" role="img" aria-label="車車世界插畫">
            <span class="art-sun"></span><span class="art-cloud cloud-one"></span>
            <span class="vehicle-scene">
              <span class="road"></span>
              <span class="truck truck-fire"><i></i><b></b></span>
              <span class="truck truck-garbage"><i></i><b></b></span>
              <span class="road-mark"></span>
            </span>
            <span class="art-sparkle">✦</span>
          </span>
          <span class="card-info"><span class="card-title">車車世界</span><span class="card-subtitle">認識車車・聽聽聲音・出任務</span><span class="card-arrow" aria-hidden="true">→</span></span>
          <span class="featured-tag">一起出發！</span>
        </button>

        <button class="world-card" data-world="animals" type="button">
          <span class="card-art art-animals" role="img" aria-label="動物世界圖片素材預留區">
            <span class="art-sun"></span><span class="animal-hill"></span>
            <span class="animal-placeholder">🐮 🐑 🐥</span><span class="art-cloud cloud-two"></span>
          </span>
          <span class="card-info"><span class="card-title">動物世界</span><span class="card-subtitle">動物叫聲・認識動物</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>

        <button class="world-card" data-world="fruits" type="button">
          <span class="card-art art-fruits" role="img" aria-label="水果世界圖片素材預留區">
            <span class="fruit-leaf"></span><span class="fruit-placeholder">🍎 🍌 🍊</span>
            <span class="fruit-shadow"></span>
          </span>
          <span class="card-info"><span class="card-title">水果世界</span><span class="card-subtitle">水果辨識・顏色・形狀</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>

        <button class="world-card" data-world="puzzles" type="button">
          <span class="card-art art-puzzles" role="img" aria-label="益智世界圖片素材預留區">
            <span class="puzzle-piece piece-a">●</span><span class="puzzle-piece piece-b">★</span>
            <span class="puzzle-piece piece-c">◆</span><span class="puzzle-piece piece-d">▲</span>
          </span>
          <span class="card-info"><span class="card-title">益智世界</span><span class="card-subtitle">配對・拼圖・記憶</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>

        <button class="world-card" data-world="sounds" type="button">
          <span class="card-art art-sounds" role="img" aria-label="聲音世界圖片素材預留區">
            <span class="music-note note-a">♪</span><span class="music-note note-b">♫</span>
            <span class="toy-xylophone"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </span>
          <span class="card-info"><span class="card-title">聲音世界</span><span class="card-subtitle">樂器・生活聲音</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
      </section>

      <section class="bottom-note">
        <span class="tiny-star">✦</span>
        <span>每一次探索，都是一個小小的成就！</span>
      </section>
    </main>

    <footer>Happy Kids <span>·</span> Play, learn & grow</footer>
  </div>

  <dialog class="parent-dialog" id="parent-dialog">
    <form method="dialog">
      <button class="dialog-close" aria-label="關閉" type="submit">×</button>
      <p class="eyebrow">FOR PARENTS</p>
      <h2>家長小天地</h2>
      <p>這裡可以查看孩子累積的星星。</p>
      <div class="parent-stars">⭐ <strong id="parent-star-count">0</strong> 顆星星</div>
      <button class="reset-button" id="reset-stars" type="button">重設星星紀錄</button>
    </form>
  </dialog>

  <dialog class="coming-dialog" id="coming-dialog">
    <form method="dialog">
      <div class="coming-icon" id="coming-icon">🚧</div>
      <h2 id="coming-title">準備中</h2>
      <p id="coming-copy">這個遊戲世界正在整理中，敬請期待！</p>
      <button class="primary-button" type="submit">知道了</button>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
